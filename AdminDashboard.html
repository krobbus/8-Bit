<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - An AI-Driven 8-bit Web Game For Personalized College Program Matching and Career Exploration</title>
    <link rel="icon" type="image/x-icon" href="public/Logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="AdminDashboard.css">
</head>

<body>
    <section id="adminDashboardContainer">
        <header>
            <h2>Welcome to dashboard, <span id="playerName">User</span></h2>

            <div class="userMetrics">
                <div class="metricCard">
                    <span id="totalUsers">0</span>
                    <p>TOTAL USERS</p>
                </div>

                <div class="metricCard">
                    <span id="totalAdmins">0</span>
                    <p>TOTAL ADMINS</p>
                </div>

                <div class="metricCard">
                    <span id="totalPlayers">0</span>
                    <p>TOTAL PLAYERS</p>
                </div>
            </div>
        </header>

        <main>
            <table>
                <thead>
                    <tr>
                        <th>LAST ACTIVE</th>
                        <th>PLAYER ID</th>
                        <th>EMAIL</th>
                        <th>NAME</th>
                        <th>GENDER</th>
                        <th>PASSWORD</th>
                        <th>PIN</th>
                        <th>COURSES</th>
                        <th>ASSESSMENTS</th>
                        <th>COMMENT</th>
                        <th>ROLE</th>
                    </tr>
                </thead>

                <tbody id="tableBody"></tbody>
            </table>
        </main>
    </section>

    <div id="loginModalRoot"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
    <script type="module" src="adminDashboard.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script type="module" src="src/pages/utils/firebaseConfig.js"></script>
    <script type="module" src="src/pages/utils/data.js"></script>

    <script type="module" src="src/components/LoginOverlay.tsx"></script>
</body>
</html>
